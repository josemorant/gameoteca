name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and verify Windows application
        if: github.event_name != 'pull_request'
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-packed-runtime.cjs
